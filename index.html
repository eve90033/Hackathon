<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Monster RPG</title>
		<!-- COOP/COEP Service Worker for GitHub Pages -->
		<script src="coi-serviceworker.js"></script>
		<!-- Google Identity Services SDK -->
		<script src="https://accounts.google.com/gsi/client" async defer></script>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	/* Lock to dev-time viewport so pixel art stays 1:1 on desktop browsers */
	width: 1280px;
	height: 720px;
	margin: auto;
	position: absolute;
	inset: 0;
	image-rendering: pixelated;
	image-rendering: crisp-edges;
}

/* Small screens (< 1280): scale down to fit window width while keeping aspect */
@media (max-width: 1280px) {
	#canvas {
		width: 100vw;
		height: calc(100vw * 9 / 16);
		max-height: 100vh;
	}
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
		// === Google Sign-In ===
		window.googleUserData = null;
		window.godotLoginCallback = null;

		function handleCredentialResponse(response) {
			try {
				var parts = response.credential.split('.');
				var payload = JSON.parse(atob(parts[1]));
				window.googleUserData = {
					id: payload.sub,
					name: payload.name,
					email: payload.email,
					picture: payload.picture || ""
				};
				console.log("[GoogleAuth] Login success:", window.googleUserData.name);
				if (window.godotLoginCallback) {
					window.godotLoginCallback(JSON.stringify(window.googleUserData));
				}
			} catch (e) {
				console.error("[GoogleAuth] Failed to parse credential:", e);
			}
		}

		function triggerGoogleLogin() {
			if (typeof google === 'undefined' || !google.accounts) {
				console.error("[GoogleAuth] GIS SDK not loaded yet");
				setTimeout(triggerGoogleLogin, 500);
				return;
			}
			google.accounts.id.initialize({
				client_id: "123910619131-masiau10ua4a8n7ivs1c5ge6rphf78ld.apps.googleusercontent.com",
				callback: handleCredentialResponse,
				auto_select: true
			});
			google.accounts.id.prompt(function(notification) {
				console.log("[GoogleAuth] prompt notification:", notification.getNotDisplayedReason() || notification.getSkippedReason() || "displayed");
				if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
					showGoogleButtonOverlay();
				}
			});
		}

		function showGoogleButtonOverlay() {
			var overlay = document.createElement('div');
			overlay.id = 'google-signin-overlay';
			overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:9999;';

			var box = document.createElement('div');
			box.style.cssText = 'background:#1a1a2e;padding:40px;border-radius:12px;text-align:center;';

			var title = document.createElement('div');
			title.textContent = 'Monster RPG Online';
			title.style.cssText = 'color:white;font-size:24px;margin-bottom:20px;font-family:sans-serif;';
			box.appendChild(title);

			var btnDiv = document.createElement('div');
			btnDiv.id = 'g_id_signin';
			box.appendChild(btnDiv);

			overlay.appendChild(box);
			document.body.appendChild(overlay);

			google.accounts.id.renderButton(btnDiv, {
				theme: 'outline',
				size: 'large',
				text: 'signin_with',
				width: 300
			});

			var checkLogin = setInterval(function() {
				if (window.googleUserData) {
					clearInterval(checkLogin);
					overlay.remove();
				}
			}, 200);
		}
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":26154624,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
